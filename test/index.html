<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>InnerNote</title>
</head>
<body>
    <div class="container">
    <h1>InnerNote</h1>
    <p class="subtitle">**気分と調子の変化を記録**</p>

   <div class="diagnosis-container">
    <div class="diagnosis-area">
    <div id="diagnosis-fixed-container" class="diagnosis-fixed-box">
        <span id="diagnosis-text">診断名: 未設定</span>
        <button type="button" class="change-btn" onclick="unlockDiagnosis()">変更</button>
    </div>
    
    <div id="diagnosis-select-container" style="display: none;">
        <select id="diagnosis-select" class="select-box" onchange="lockDiagnosis()">
            <option value="">診断名を選択</option>
            <option value="双極症">双極症</option>
            <option value="うつ病">うつ病</option>
            <option value="適応障害">適応障害</option>
        </select>
    </div>
    </div>
</body>
</html>
