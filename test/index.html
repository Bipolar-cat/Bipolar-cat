<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InnerNote</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
    <h1>InnerNote</h1>
    <p class="subtitle">**気分と調子の変化を記録**</p>

    <div id="diagnosis-area" class="input-section">
        </div>

    <div class="input-section">
        <label class="label">今の気分？ (1〜10)</label>
        <div id="mood-btns" class="scroll-wrapper btn-group-circle"></div>
        
        <label class="label">体の調子？ (1〜10)</label>
        <div id="cond-btns" class="scroll-wrapper btn-group-circle"></div>
    </div>

    <div class="input-section">
        <textarea id="note"></textarea>
        <button class="save-btn" onclick="saveData()">記録する</button>
    </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
