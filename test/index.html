<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InnerNote - Perfect Sync 350</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container">
        <h1>InnerNote</h1>
        <p class="subtitle">**気分と調子の変化を記録**</p>

        <div class="diagnosis-area" style="margin-bottom: 20px;">
            <div id="diagnosis-select-container" style="display: block;">
                <select id="diagnosis-select" class="diagnosis-select" onchange="lockDiagnosis()" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; background: white;">
                    <option value="">主な診断名を選択</option>
                    <option value="うつ病">うつ病</option>
                    <option value="双極症">双極症</option>
                    <option value="その他">その他</option>
                </select>
            </div>
           <div id="diagnosis-fixed-container" style="display: none; ...">
    <span id="diagnosis-text" style="font-weight: bold; color: #333;"></span>
    <button type="button" class="change-btn" onclick="unlockDiagnosis()">変更</button>
</div>
        </div>

        <div class="input-section">
            <label class="label">今の気分？ (1～10)</label>
            <div class="scroll-wrapper"><div id="mood-btns" class="btn-group-circle"></div></div>

            <label class="label">体の調子？ (1～10)</label>
            <div class="scroll-wrapper"><div id="cond-btns" class="btn-group-circle"></div></div>

            <textarea id="note" placeholder="今の気持ちをメモ..."></textarea>
            <button class="save-btn" onclick="saveData()">記録する</button>
        </div>

        <div class="chart-scroll" style="margin: 20px 0;">
            <div id="chart-wrapper" style="height: 300px; width: 100%;">
                <canvas id="myChart"></canvas>
            </div>
        </div>

        <div class="summary-section" style="text-align: center; margin: 20px 0;">
            <button class="summary-action-btn" onclick="generateSummary()">summary (一定期間まとめ)</button>
            <div id="summary-ts">前回まとめ作成：なし</div>
            <div id="summary-card"><div id="summary-content"></div></div>
        </div>

        <div class="log-title" style="font-weight: bold; margin-top: 20px;">最近の記録</div>
        <div id="log-list" class="log-list"></div>

    </div> <script src="script.js"></script>
</body>
</html>
