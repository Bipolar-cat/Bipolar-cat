<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InnerNote</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>InnerNote</h1>
        <p>**気分と調子の変化を記録**</p>

        <div id="diagnosis-area" class="input-section">
            <p>主な診断名を選択</p>
            <select id="diagnosis-select">
                <option value="双極症">双極症</option>
                <option value="うつ病">うつ病</option>
            </select>
        </div>

        <div class="input-section">
            <label class="label">今の気分？ (1〜10)</label>
            <div id="mood-btns" class="scroll-wrapper"></div>
            
            <label class="label">体の調子？ (1〜10)</label>
            <div id="cond-btns" class="scroll-wrapper"></div>
        </div>
        </div>
    <div class="input-section">
    <textarea id="note" placeholder="今の気持ちをメモ..."></textarea>
    <button class="save-btn" onclick="saveData()">記録する</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
