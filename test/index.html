<div id="diagnosis-container" style="border: 1px solid #ccc; padding: 10px; border-radius: 8px;">
    <div id="diagnosis-fixed-container" style="display: flex; justify-content: space-between; align-items: center;">
        <span id="diagnosis-text">主な診断名: 未設定</span>
        <button onclick="unlockDiagnosis()" style="color: blue; border: none; background: none;">変更</button>
    </div>
    <div id="diagnosis-select-container" style="display: none;">
        <select id="diagnosis-select" onchange="lockDiagnosis()" style="width: 100%;">
            <option value="双極症">双極症</option>
            <option value="うつ病">うつ病</option>
        </select>
    </div>
</div>
