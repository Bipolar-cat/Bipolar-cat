<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InnerNote</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container">
        <h1>InnerNote</h1>
        <p class="subtitle">**気分と調子の変化を記録**</p>

        <div class="diagnosis-container">
    <div id="diagnosis-fixed-container" class="diagnosis-fixed-container" style="display: none;">
        <span id="diagnosis-text" class="diagnosis-text">主な診断名: </span>
        <button type="button" onclick="enableDiagnosisChange()" class="change-btn">変更</button>
    </div>

    <div id="diagnosis-select-container" class="diagnosis-select-container">
        <label for="diagnosis-select" class="label-text">主な診断名を選択</label>
        <div class="diagnosis-input-group">
            <select id="diagnosis-select" onchange="toggleOtherDiagnosis()" class="diagnosis-select">
                <option value="指定なし">指定なし</option>
                <option value="双極症">双極症</option>
                <option value="うつ病">うつ病</option>
                <option value="統合失調症">統合失調症</option>
                <option value="不安症">不安症</option>
                <option value="その他">その他 (入力する)</option>
            </select>
            <input type="text" id="diagnosis-other" placeholder="診断名を入力..." class="diagnosis-other-input" style="display: none;">
        </div>
    </div>
        </div>

        <div class="input-section">
            <label class="label">今の気分？ (1～10)</label>
            <div class="scroll-wrapper"><div id="mood-btns" class="btn-group-circle"></div></div>
            <label class="label">体の調子？ (1～10)</label>
            <div class="scroll-wrapper"><div id="cond-btns" class="btn-group-circle"></div></div>
            <textarea id="note" placeholder="今の気持ちをメモ..."></textarea>
            <button class="save-btn" onclick="saveData()">記録する</button>
        </div>

        <div class="chart-container" style="overflow-x: auto;">
            <div id="chart-wrapper" style="width: 800px; height: 350px;">
                <canvas id="myChart"></canvas>
            </div>
        </div>

        <div class="summary-section">
            <button class="summary-action-btn" onclick="generateSummary()">summary (一定期間まとめ)</button>
            <div id="summary-ts">前回まとめ作成：なし</div>
            <div id="summary-card"><div id="summary-content"></div></div>
        </div>

        <div class="log-title">最近の記録</div>
        <div id="log-list" class="log-list"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
