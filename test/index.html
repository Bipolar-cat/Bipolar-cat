<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InnerNote</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>InnerNote</h1>
        <p class="subtitle">気分と調子の変化を記録</p>

        <div id="diagnosis-container" class="box">
            <span>主な診断名: 双極症</span>
            <button>変更</button>
        </div>

        <div class="box">
            <p>今の気分？ (1〜10)</p>
<div id="mood-btns" style="display: flex; gap: 5px; justify-content: center; flex-wrap: wrap; margin-bottom: 20px;"></div>
        </div>

        <div class="box">
            <p>今の気持ちをメモ...</p>
            <textarea style="width:100%;"></textarea>
            <button style="width:100%;">記録する</button>
        </div>
    </div>    
    <script src="script.js"></script>
</body>
</html>
