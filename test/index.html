<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>InnerNote</title>
</head>
<body>
    <div class="container">
    <h1>InnerNote</h1>
    <p class="subtitle">**気分と調子の変化を記録**</p>

 <div class="diagnosis-area">
    <div id="diagnosis-box" class="diagnosis-fixed-box">
        <div id="display-mode" style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
            <span id="diagnosis-text">主な診断名: 未設定</span>
            <button type="button" class="change-btn" onclick="unlockDiagnosis()">変更</button>
        </div>
        <div id="edit-mode" style="display: none; width: 100%;">
            <select id="diagnosis-select" class="select-box" onchange="saveAndLock()">
             <option value="">主な診断名を選択</option>
            <option value="未診断（健常者）">未診断（健常者）</option>
            <option value="うつ病">うつ病</option>
            <option value="双極症">双極症</option>
            <option value="統合失調症">統合失調症</option>
            <option value="不安障害">不安障害</option>
            <option value="適応障害">適応障害</option>
            <option value="発達障害">発達障害</option>
            <option value="その他">その他</option>
            </select>
        </div>
    </div>
</div>

<div class="input-section" style="margin-top: 20px;">
    <div class="label">今の気分？ (1〜10)</div>
    <div id="mood-btns" class="scroll-wrapper"></div>

    <div class="label" style="margin-top: 15px;">体の調子？ (1〜10)</div>
    <div id="physical-btns" class="scroll-wrapper"></div>
</div> 
</body>
</html>
