<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InnerNote - Perfect Sync 350 (Diagnosis & Summary Ver)</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* 全体の背景とフォント、パディングを最適化 */
        body {
            font-family: 'Helvetica Neue', Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            padding: 10px;
            display: flex;
            justify-content: center;
        }

        /* 大枠の形（幅450px、角丸25px、パディング）を完全統一 */
        .container {
            max-width: 450px;
            width: 100%;
            background: white;
            padding: 20px 0;
            border-radius: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            text-align: center;
            overflow: hidden;
        }

        h1 {
            color: #5C6BC0;
            font-size: 28px;
            margin: 5px 0 0 0;
        }

        .subtitle {
            color: #888;
            font-size: 0.75rem;
            font-weight: bold;
            margin-bottom: 15px;
        }

        /* --- 主な診断名エリア（左の表から完全忠実に移植） --- */
        .diagnosis-area {
            width: 66.6%;
            margin: 0 auto 20px auto;
            text-align: left;
            box-sizing: border-box;
        }

        .change-btn {
            background: none;
            border: none;
            color: #4A90E2;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            padding: 0;
        }

        /* ----------------------------------------------- */

        .input-section {
            padding: 0 20px;
        }

        .label {
            display: block;
            text-align: left;
            font-weight: bold;
            margin: 8px 0 5px 5px;
            color: #333;
            font-size: 15px;
        }

        .scroll-wrapper {
            overflow-x: auto;
            white-space: nowrap;
            padding: 2px 0 10px 5px;
            -webkit-overflow-scrolling: touch;
        }

        .scroll-wrapper::-webkit-scrollbar { display: none; }

        .btn-group-circle {
            display: inline-flex;
            gap: 12px;
        }

        .btn-group-circle button {
            width: 52px;
            height: 52px;
            min-width: 52px;
            border-radius: 50%;
            border: 1px solid #e5e7eb;
            background: #ffffff;
            color: #9ca3af;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            padding: 0;
        }

        #mood-btns button.active {
            border: 2px solid #bfdbfe;
            color: #3b82f6;
            background-color: #eff6ff;
            font-weight: bold;
        }

        #cond-btns button.active {
            border: 2px solid #fde68a;
            color: #f59e0b;
            background-color: #fffbeb;
            font-weight: bold;
        }

        textarea {
            width: 100%;
            height: 50px;
            margin: 5px 0 15px 0;
            padding: 10px 15px;
            border-radius: 12px;
            border: none;
            background-color: #f3f4f6;
            font-size: 14px;
            box-sizing: border-box;
            resize: none;
            color: #333;
        }

        .save-btn {
            width: 100%;
            padding: 12px;
            background-color: #4A90E2;
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 20px;
            display: block;
        }

        /* グラフエリア（スクロール対応） */
        .chart-container {
            width: 100%;
            height: 350px;
            border-top: 1px solid #f3f4f6;
            padding-top: 15px;
            overflow-x: auto;
            white-space: nowrap;
        }
        #chart-wrapper {
            height: 300px;
            position: relative;
        }

        .summary-section {
            padding: 0 20px;
            margin-top: 20px;
            text-align: center;
        }

        .summary-action-btn {
            background-color: #00C853;
            color: white;
            border: none;
            padding: 13px 35px;
            border-radius: 50px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 200, 83, 0.15);
            transition: 0.2s;
            display: inline-block;
        }

        #summary-ts { font-size: 11px; color: #B0BEC5; margin: 10px 0; }

        #summary-card {
            display: none;
            text-align: left;
            background-color: #F1F8E9;
            border-radius: 20px;
            padding: 20px;
            border: 1px solid #DCEDC8;
            font-size: 14px;
            line-height: 1.6;
            margin-top: 15px;
            margin-bottom: 20px;
        }

        .report-header { font-weight: bold; color: #2E7D32; font-size: 15px; border-bottom: 1px dashed #C5E1A5; padding-bottom: 6px; margin-bottom: 12px; display: block; }
        .report-item { margin-bottom: 8px; color: #333; }
        .report-label { font-weight: bold; color: #558B2F; min-width: 80px; display: inline-block; }
        .report-notes { background: white; padding: 10px 14px; border-radius: 10px; border: 1px solid #E8F5E9; margin-top: 6px; max-height: 100px; overflow-y: auto; font-size: 13px; color: #555; }

        .log-title { text-align: center; font-size: 18px; font-weight: bold; color: #444; margin: 30px 0 15px; }
        .log-list { padding: 0 20px; }
        
        .log-item {
            text-align: left;
            padding: 15px;
            margin-bottom: 12px;
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 15px;
            font-size: 14px;
            box-sizing: border-box;
        }
        .log-item.highlight { background-color: #fff9c4 !important; border-color: #fbc02d !important; }
        .log-date { color: #4b5563; font-weight: bold; display: block; margin-bottom: 4px; font-size: 13px; }
        .log-diagnosis { display: inline-block; background-color: #e8eaf6; color: #3f51b5; padding: 2px 8px; border-radius: 6px; font-size: 11px; font-weight: bold; margin-left: 8px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>InnerNote</h1>
        <p class="subtitle">**気分と調子の変化を記録**</p>

        <div class="diagnosis-area" style="margin-bottom: 20px;">
            <div id="diagnosis-select-container" style="display: block;">
                <select id="diagnosis-select" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; background: white; -webkit-appearance: none; appearance: none;">
                    <option value="">主な診断名を選択</option>
                    <option value="未診断（健常者）">未診断（健常者）</option>
                    <option value="うつ病">うつ病</option>
                    <option value="双極症">双極症</option>
                    <option value="統合失調症">統合失調症</option>
                    <option value="不安障害">不安障害</option>
                    <option value="適応障害">適応障害</option>
                    <option value="発達障害">発達障害</option>
                    <option value="その他">その他</option>
                </select>
            </div>
            <div id="diagnosis-fixed-container" style="background: #efefef; padding: 10px 15px; border-radius: 8px; display: none; align-items: center; justify-content: space-between; font-size: 16px;">
                <span id="diagnosis-text" style="font-weight: bold; color: #333;">診断名: 未設定</span>
                <button type="button" class="change-btn" onclick="unlockDiagnosis()">変更</button>
            </div>
        </div>

        <div class="input-section">
            <label class="label">今の気分？ (1～10)</label>
            <div class="scroll-wrapper"><div id="mood-btns" class="btn-group-circle"></div></div>
            <label class="label">体の調子？ (1～10)</label>
            <div class="scroll-wrapper"><div id="cond-btns" class="btn-group-circle"></div></div>
            <textarea id="note" placeholder="今の気持ちをメモ..."></textarea>
            <button class="save-btn" onclick="saveData()">記録する</button>
        </div>

        <div class="chart-container">
            <div id="chart-wrapper">
                <canvas id="myChart"></canvas>
            </div>
        </div>

        <div class="summary-section">
            <button class="summary-action-btn" onclick="generateSummary()">summary (一定期間まとめ)</button>
            <div id="summary-ts">前回まとめ作成：なし</div>
            <div id="summary-card">
                <span class="report-header">【一定期間まとめレポート】</span>
                <div id="summary-content"></div>
            </div>
        </div>

        <div class="log-title">最近の記録</div>
        <div id="log-list" class="log-list"></div>
    </div>

    <script>
        let selectedMood = 5, selectedCond = 5;
        let highlightTimeout = null;
        const STORAGE_KEY = 'innernote_vfinal_400_logs';
        const DIAGNOSIS_KEY = 'innernote_saved_diagnosis';

        function createCircleButtons(containerId, type) {
            const container = document.getElementById(containerId);
            for (let i = 1; i <= 10; i++) {
                const btn = document.createElement('button');
                btn.innerText = i;
                if (i === 5) btn.className = 'active';
                btn.onclick = function() {
                    container.querySelectorAll('button').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    if (type === 'mood') selectedMood = i; else selectedCond = i;
                };
                container.appendChild(btn);
            }
        }
        createCircleButtons('mood-btns', 'mood');
        createCircleButtons('cond-btns', 'cond');

        function saveData() {
            const note = document.getElementById('note').value;
            let diagnosisVal = localStorage.getItem(DIAGNOSIS_KEY) || "双極症";
            const now = new Date();
            const dateStr = `${now.getFullYear()}/${now.getMonth()+1}/${now.getDate()} ${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;
            const logs = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
            logs.push({ ts: now.getTime(), date: dateStr, diagnosis: diagnosisVal, mood: selectedMood, cond: selectedCond, note: note });
            localStorage.setItem(STORAGE_KEY, JSON.stringify(logs));
            location.reload();
        }

        window.onload = () => {
            const logs = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
            
            // グラフ用コンテナの幅調整
            const wrapper = document.getElementById('chart-wrapper');
            wrapper.style.width = Math.max(window.innerWidth, logs.length * 50) + 'px';

            const ctx = document.getElementById('myChart').getContext('2d');
            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: logs.map(l => l.date),
                    datasets: [
                        { label: '気分', data: logs.map(l => l.mood), borderColor: '#3b82f6', borderWidth: 2, tension: 0.3 },
                        { label: '体調', data: logs.map(l => l.cond), borderColor: '#f59e0b', borderWidth: 2, tension: 0.3 }
                    ]
                },
                options: {
    responsive: false, // 既存の設定
    maintainAspectRatio: false, // 既存の設定
    scales: {
        y: {
            min: 1,      // 最小値を1に固定
            max: 10,     // 最大値を10に固定
            ticks: {
                stepSize: 1 // 目盛りを1刻みにする
            }
        }
    }
                }

            // 履歴リスト描画などの既存処理
            const logList = document.getElementById('log-list');
            logs.slice().reverse().forEach(l => {
                const div = document.createElement('div');
                div.className = 'log-item';
                div.innerHTML = `<span class="log-date">${l.date}</span>気分: ${l.mood} | 体調: ${l.cond}<br>${l.note || ''}`;
                logList.appendChild(div);
            });
        };
    </script>
</body>
</html>
