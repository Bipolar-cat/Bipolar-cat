<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InnerNote</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>InnerNote</h1>
        <p class="subtitle">気分と調子の変化を記録</p>

        <div id="diagnosis-container" class="diagnosis-box">
    <div id="diagnosis-fixed-container">
        <span id="diagnosis-text">主な診断名: 未設定</span>
        <button type="button" class="change-btn" onclick="unlockDiagnosis()">変更</button>
    </div>

    <div id="diagnosis-select-container" style="display: none;">
        <select id="diagnosis-select" onchange="lockDiagnosis()">
            <option value="">診断名を選択してください</option>
            <option value="双極症">双極症</option>
            <option value="うつ病">うつ病</option>
            <option value="不安障害">不安障害</option>
        </select>
    </div>
        </div>

        <div class="box">
            <p>今の気分？ (1〜10)</p>
<div id="mood-btns" style="display: flex; gap: 5px; justify-content: center; flex-wrap: wrap; margin-bottom: 20px;"></div>
        </div>

        <div class="box">
            <p>今の気持ちをメモ...</p>
            <textarea style="width:100%;"></textarea>
            <button style="width:100%;">記録する</button>
        </div>
    </div>    
    <script src="script.js"></script>
</body>
</html>
