<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InnerNote</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container">
        <h1>InnerNote</h1>
        <p>気分と調子の記録</p>

        <div id="diagnosis-area">
            <select id="diagnosis-select" onchange="lockDiagnosis()">
                <option value="">診断名を選択</option>
                <option value="うつ病">うつ病</option>
                <option value="双極症">双極症</option>
                <option value="その他">その他</option>
            </select>
            <div id="diagnosis-fixed" style="display:none;">
                <span id="diagnosis-text"></span>
                <button onclick="unlockDiagnosis()">変更</button>
            </div>
        </div>

        <div class="input-section">
            <p>今の気分？ (1-10)</p>
            <div id="mood-btns" class="btn-group"></div>
            
            <p>体の調子？ (1-10)</p>
            <div id="cond-btns" class="btn-group"></div>

            <textarea id="note" placeholder="一言メモ..."></textarea>
            <button onclick="saveData()">記録する</button>
        </div>

        <div class="chart-container">
            <canvas id="myChart"></canvas>
        </div>

        <button onclick="generateSummary()">まとめを作成</button>
        <div id="summary-content"></div>
        
        <h3>最近の記録</h3>
        <div id="log-list"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
