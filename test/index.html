<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>InnerNote - Perfect Sync</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* デザイン・ボタン・グラフ用CSSをここに記述 */
        body { font-family: sans-serif; padding: 10px; display: flex; justify-content: center; }
        .container { max-width: 450px; width: 100%; }
        .btn-group-circle { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; }
        .btn-group-circle button { width: 45px; height: 45px; border-radius: 50%; border: 1px solid #ccc; background: white; cursor: pointer; }
        .btn-group-circle button.active { background: #4A90E2; color: white; border: none; }
        .chart-container { width: 100%; height: 300px; overflow-x: auto; border: 1px solid #eee; margin-top: 20px; }
        #chart-wrapper { height: 280px; position: relative; }
    </style>
</head>
<body>
    <div class="container">
        <h1>InnerNote</h1>
        <select id="diagnosis-select"><option>双極症</option><option>うつ病</option></select>
        
        <label>今の気分？</label>
        <div id="mood-btns" class="btn-group-circle"></div>
        <label>体の調子？</label>
        <div id="cond-btns" class="btn-group-circle"></div>
        
        <textarea id="note" placeholder="メモ..."></textarea>
        <button onclick="saveData()">記録する</button>

        <div class="chart-container">
            <div id="chart-wrapper"><canvas id="myChart"></canvas></div>
        </div>
    </div>

    <script>
        // ボタン作成関数
        function createButtons(id, type) {
            const container = document.getElementById(id);
            for(let i=1; i<=10; i++) {
                let b = document.createElement('button');
                b.innerText = i;
                b.onclick = function() {
                    container.querySelectorAll('button').forEach(btn => btn.classList.remove('active'));
                    this.classList.add('active');
                };
                container.appendChild(b);
            }
        }
        createButtons('mood-btns', 'mood');
        createButtons('cond-btns', 'cond');

        // グラフ描画など
        // ... (以前のrenderScrollableChartロジックをここに統合)
    </script>
</body>
</html>
