<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <title>InnerNote</title>
</head>
<body>
    <div class="app-container">
        <div class="header-container">
            <h1 class="main-title">InnerNote</h1>
            <p class="sub-title">**気分と調子の変化を記録**</p>
        </div>

        <div class="diagnosis-container">
            <span id="diagnosis-text">主な診断名: 未設定</span>
            <button class="edit-btn">変更</button>
        </div>

        <p class="label">今の気分？ (1〜10)</p>
        <div id="mood-btns" class="button-group"></div>

        <p class="label">体の調子？ (1〜10)</p>
        <div id="body-condition-btns" class="button-group"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
