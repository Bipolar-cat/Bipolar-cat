<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InnerNote</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrapper">
    <h1 class="main-title">InnerNote</h1>
    <p class="sub-title">**気分と調子の変化を記録**</p>

  <div class="diagnosis-card" id="diagnosisWrapper">
    <div class="diagnosis-display" id="diagnosisDisplay">
        <span>主な診断名: <strong id="diagnosisName">未設定</strong></span>
        <button class="edit-btn" onclick="toggleEdit()">変更</button>
    </div>
    
    <div class="diagnosis-edit" id="diagnosisEdit" style="display: none;">
        <select id="diagnosisSelect">
            <option value="双極症">双極症</option>
            <option value="うつ病">うつ病</option>
            <option value="適応障害">適応障害</option>
            <option value="その他">その他</option>
        </select>
        <button class="save-btn" onclick="saveDiagnosis()">決定</button>
        </div>
    </div>
</div>
    
    <script src="script.js"></script>
</body>
</html>
