<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InnerNote</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container">
        <h1>InnerNote</h1>
        <p>**気分と調子の変化を記録**</p>

        <div class="input-section">
        <label class="label">主な診断名を選択</label>
        <select id="diagnosis-select" style="width: 100%; padding: 10px; margin-bottom: 10px; border-radius: 12px; border: 1px solid #e5e7eb;">
            <option value="双極症">双極症</option>
            <option value="うつ病">うつ病</option>
            <option value="適応障害">適応障害</option>
            <option value="その他">その他</option>
        </select>
        </div>

        <div class="input-section">
    <label class="label">今の気分？ (1～10)</label>
    <div class="scroll-wrapper">
        <div id="mood-btns" class="btn-group-circle"></div>
    </div>

    <label class="label">体の調子？ (1～10)</label>
    <div class="scroll-wrapper">
        <div id="cond-btns" class="btn-group-circle"></div>
    </div>
</div>

        <div class="input-section">
            <textarea id="note" placeholder="今の気持ちをメモ..."></textarea>
            <button class="save-btn" onclick="saveData()">記録する</button>
        </div>

        <div class="input-section" style="margin-top: 20px;">
            <div class="scroll-container" style="overflow-x: auto; width: 100%;">
                <div style="width: 800px;">
                    <canvas id="myChart" height="200"></canvas>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
