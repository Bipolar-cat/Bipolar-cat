<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <title>InnerNote</title>
</head>
<body>
<div class="container">
    <h1>InnerNote</h1>
    <p class="subtitle">**気分と調子の変化を記録**</p>

    <div class="diagnosis-area" style="margin-bottom: 20px;">
        <div id="diagnosis-select-container" style="display: block;">
            <select id="diagnosis-select" class="diagnosis-select" onchange="lockDiagnosis()">
                <option value="">主な診断名を選択</option>
                <option value="未診断（健常者）">未診断（健常者）</option>
                <option value="うつ病">うつ病</option>
                <option value="双極症">双極症</option>
                <option value="統合失調症">統合失調症</option>
                <option value="不安障害">不安障害</option>
                <option value="適応障害">適応障害</option>
                <option value="発達障害">発達障害</option>
            </select>
        </div>
        <div id="diagnosis-fixed-container" style="display: none;">
            <span id="diagnosis-text">診断名: 未設定</span>
            <button type="button" onclick="unlockDiagnosis()">変更</button>
        </div>
    </div>

    <div class="input-area">
        <div id="mood-btns">気分(1-10): </div>
        <div id="cond-btns">体調(1-10): </div>
        <input type="text" id="note" placeholder="今の気持ちをメモ...">
        <button onclick="saveData()">記録する</button>
    </div>

    <div style="width: 100%; overflow-x: auto;">
        <div style="width: 800px;"> <canvas id="myChart"></canvas> </div>
    </div>

    <div class="log-title">最近の記録</div>
    <div id="log-list" class="log-list"></div>
</div>

<script src="script.js"></script>
</body>
</html>
