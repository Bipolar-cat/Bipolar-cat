<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InnerNote</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrapper">
    <h1 class="main-title">InnerNote</h1>
    <p class="sub-title">**気分と調子の変化を記録**</p>

  <div class="diagnosis-card" id="diagnosisCard">
    <div id="displayArea" class="diagnosis-content" onclick="toggleMenu()">
        <span id="diagnosisLabel">主な診断名: <strong id="diagnosisName">未設定</strong></span>
        <button id="editBtn" style="display: none;">変更</button>
    </div>

    <div id="menuArea" class="diagnosis-menu" style="display: none;">
        <div class="menu-item" onclick="selectDiagnosis('双極症')">双極症</div>
        <div class="menu-item" onclick="selectDiagnosis('うつ病')">うつ病</div>
        <div class="menu-item" onclick="selectDiagnosis('適応障害')">適応障害</div>
        <div class="menu-item" onclick="selectDiagnosis('その他')">その他</div>
    </div>
  </div>
        </select>
        
        <input type="text" id="otherInput" placeholder="診断名を入力" style="display: none;">
        <button class="save-btn" onclick="saveDiagnosis()">保存</button>
    </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
