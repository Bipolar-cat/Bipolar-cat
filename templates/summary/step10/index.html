<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='summary/step10/style.css') }}">
    <script src="{{ url_for('static', filename='summary/step10/script.js') }}"></script>
    <title>InnerNote - Perfect Sync 350 (Summary Ver)</title>

<script>
function renderScrollableChart(logs) {
    const canvas = document.getElementById('myChart');
    const container = document.getElementById('chart-wrapper');
    
    // データ数に合わせて幅を計算
    const newWidth = Math.max(window.innerWidth, logs.length * 50);
    container.style.width = newWidth + 'px';

    if (window.myChartInstance) window.myChartInstance.destroy();

    const ctx = canvas.getContext('2d');
    window.myChartInstance = new Chart(ctx, {
        type: 'line',
        data: {
            labels: logs.map(l => l.date),
            datasets: [
                { label: '気分', data: logs.map(l => l.mood), borderColor: '#3b82f6' },
                { label: '体調', data: logs.map(l => l.cond), borderColor: '#f59e0b' }
            ]
        },
        options: {
            responsive: false,
            maintainAspectRatio: false
        }
    });
}

// 3. 実行（ページ読み込み時に実行する）
window.onload = () => {
    const logs = JSON.parse(localStorage.getItem('innernote_vfinal_400_logs') || '[]');
    renderScrollableChart(logs);
};
</script>
    <style>
        /* 全体の背景とフォント、パディングを最適化 */
        body {
            font-family: 'Helvetica Neue', Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            padding: 10px;
            display: flex;
            justify-content: center;
        }

        /* 大枠の形（幅450px、角丸25px、パディング）を完全統一 */
        .container {
            max-width: 450px;
            width: 100%;
            background: white;
            padding: 20px 0;
            border-radius: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            text-align: center;
            overflow: hidden;
        }

        h1 {
            color: #5C6BC0;
            font-size: 28px;
            margin: 5px 0 0 0;
        }

        .subtitle {
            color: #888;
            font-size: 0.75rem;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .input-section {
            padding: 0 20px;
        }

        .label {
            display: block;
            text-align: left;
            font-weight: bold;
            margin: 8px 0 5px 5px;
            color: #333;
            font-size: 15px;
        }

        .scroll-wrapper {
            overflow-x: auto;
            white-space: nowrap;
            padding: 2px 0 10px 5px;
            -webkit-overflow-scrolling: touch;
        }

        .scroll-wrapper::-webkit-scrollbar { display: none; }

        /* 10段階ボタンの横並びgapと配置 */
        .btn-group-circle {
            display: inline-flex;
            gap: 12px;
        }

        /* ボタンの大きさ（52px正円）とフォント・カラーを完全一致 */
        .btn-group-circle button {
            width: 52px;
            height: 52px;
            min-width: 52px;
            border-radius: 50%;
            border: 1px solid #e5e7eb;
            background: #ffffff;
            color: #9ca3af;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            padding: 0;
        }

        #mood-btns button.active {
            border: 2px solid #bfdbfe;
            color: #3b82f6;
            background-color: #eff6ff;
            font-weight: bold;
        }

        #cond-btns button.active {
            border: 2px solid #fde68a;
            color: #f59e0b;
            background-color: #fffbeb;
            font-weight: bold;
        }

        /* 今の気持ちメモの大きさ（高さ50px、角丸12px、背景色）を完全一致 */
        textarea {
            width: 100%;
            height: 50px;
            margin: 5px 0 15px 0;
            padding: 10px 15px;
            border-radius: 12px;
            border: none;
            background-color: #f3f4f6;
            font-size: 14px;
            box-sizing: border-box;
            resize: none;
            color: #333;
        }

        .save-btn {
            width: 100%;
            padding: 12px;
            background-color: #4A90E2;
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 20px;
            display: block;
        }

        /* グラフエリア（高さ350px、直結ボーダー、余白）の完全統一 */
        .chart-container {
            width: 100%;
            height: 350px;
            border-top: 1px solid #f3f4f6;
            padding-top: 15px;
        }

        /* Summary機能用レイアウトスタイル */
        .summary-section {
            padding: 0 20px;
            margin-top: 20px;
            text-align: center;
        }

        .summary-action-btn {
            background-color: #00C853;
            color: white;
            border: none;
            padding: 13px 35px;
            border-radius: 50px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 200, 83, 0.15);
            transition: 0.2s;
            display: inline-block;
        }

        .summary-action-btn:active { transform: scale(0.98); }

        #summary-ts { font-size: 11px; color: #B0BEC5; margin: 10px 0; }

        #summary-card {
            display: none;
            text-align: left;
            background-color: #F1F8E9;
            border-radius: 20px;
            padding: 20px;
            border: 1px solid #DCEDC8;
            font-size: 14px;
            line-height: 1.6;
            animation: fadeIn 0.3s ease-out;
            margin-top: 15px;
            margin-bottom: 20px;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        
        .report-header { font-weight: bold; color: #2E7D32; font-size: 15px; border-bottom: 1px dashed #C5E1A5; padding-bottom: 6px; margin-bottom: 12px; display: block; }
        .report-item { margin-bottom: 8px; color: #333; }
        .report-label { font-weight: bold; color: #558B2F; min-width: 80px; display: inline-block; }
        .report-notes { background: white; padding: 10px 14px; border-radius: 10px; border: 1px solid #E8F5E9; margin-top: 6px; max-height: 100px; overflow-y: auto; font-size: 13px; color: #555; }

        .log-title { text-align: center; font-size: 18px; font-weight: bold; color: #444; margin: 30px 0 15px; }
        .log-list { padding: 0 20px; }
        
        .log-item {
            text-align: left;
            padding: 15px;
            margin-bottom: 12px;
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 15px;
            font-size: 14px;
            transition: background-color 0.4s, border-color 0.4s;
            box-sizing: border-box;
        }

        .log-item.highlight {
            background-color: #fff9c4 !important;
            border-color: #fbc02d !important;
        }

        .log-date {
            color: #4b5563;
            font-weight: bold;
            display: block;
            margin-bottom: 4px;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>InnerNote</h1>
        <p class="subtitle">**気分と調子の変化を記録**</p>

        <div class="input-section">
            <label class="label">今の気分？ (1～10)</label>
            <div class="scroll-wrapper">
                <div id="mood-btns" class="btn-group-circle"></div>
            </div>

            <label class="label">体の調子？ (1～10)</label>
            <div class="scroll-wrapper">
                <div id="cond-btns" class="btn-group-circle"></div>
            </div>

            <textarea id="note" placeholder="今の気持ちをメモ..."></textarea>
            <button class="save-btn" onclick="saveData()">記録する</button>
        </div>

        <div class="chart-container">
            <canvas id="myChart"></canvas>
        </div>

        <div class="summary-section">
            <button class="summary-action-btn" onclick="generateSummary()">summary (一定期間まとめ)</button>
            <div id="summary-ts">前回まとめ作成：なし</div>
            
            <div id="summary-card">
                <span class="report-header">【一定期間まとめレポート】</span>
                <div id="summary-content"></div>
            </div>
        </div>

        <div class="log-title">最近の記録</div>
        <div id="log-list" class="log-list"></div>
    </div>

    <script>
        let selectedMood = 5, selectedCond = 5;
        let highlightTimeout = null;
        
        // ローカルストレージ用のキーを設定
        const STORAGE_KEY = 'innernote_vfinal_400_logs';

        // 10段階サークルスクロールボタンの生成
        function createCircleButtons(containerId, type) {
            const container = document.getElementById(containerId);
            for (let i = 1; i <= 10; i++) {
                const btn = document.createElement('button');
                btn.innerText = i;
                if (i === 5) btn.className = 'active';
                btn.onclick = function() {
                    container.querySelectorAll('button').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    if (type === 'mood') selectedMood = i;
                    else selectedCond = i;
                };
                container.appendChild(btn);
            }
        }

        createCircleButtons('mood-btns', 'mood');
        createCircleButtons('cond-btns', 'cond');

        // データの保存処理
        function saveData() {
            const note = document.getElementById('note').value;
            const now = new Date();
            const dateStr = `${now.getFullYear()}/${now.getMonth()+1}/${now.getDate()} ${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;
            const logs = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
            
            // 各ログに一意のタイムスタンプ（ts）を付与して保存
            logs.push({ ts: now.getTime(), date: dateStr, mood: selectedMood, cond: selectedCond, note: note });
            localStorage.setItem(STORAGE_KEY, JSON.stringify(logs));
            alert("記録しました！");
            location.reload();
        }

        // summary (一定期間まとめ) 生成ロジック
        function generateSummary() {
            const logs = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
            if (logs.length === 0) return alert("まとめを作成するための記録がありません。");

            const lastSummaryTs = parseInt(localStorage.getItem('last_summary_ts_final') || '0');
            // 前回まとめ作成以降のデータをフィルタリング（なければ直近10件を提示）
            let targets = logs.filter(l => (l.ts || new Date(l.date).getTime()) > lastSummaryTs);
            
            if (targets.length === 0) {
                if(confirm("前回作成以降の新しい記録がありません。直近のデータを再集計しますか？")) {
                    targets = logs.slice(-10); 
                } else {
                    return;
                }
            }
            
            const avgMood = (targets.reduce((acc, curr) => acc + curr.mood, 0) / targets.length).toFixed(1);
            const avgCond = (targets.reduce((acc, curr) => acc + curr.cond, 0) / targets.length).toFixed(1);
            
            const notesList = targets.filter(l => l.note && l.note.trim() !== '').map(l => `・ ${l.note}`).join('<br>');
            const periodStr = `${targets[0].date.split(' ')[0]} ～ ${targets[targets.length-1].date.split(' ')[0]}`;

            document.getElementById('summary-card').style.display = 'block';
            document.getElementById('summary-content').innerHTML = `
                <div class="report-item"><span class="report-label">対象期間:</span> ${periodStr} (${targets.length}件の記録)</div>
                <div class="report-item"><span class="report-label">平均気分:</span> ${avgMood} / 10.0 (${getEvaluationLabel(avgMood)})</div>
                <div class="report-item"><span class="report-label">平均体調:</span> ${avgCond} / 10.0 (${getEvaluationLabel(avgCond)})</div>
                <div class="report-item" style="margin-top: 8px;"><span class="report-label">期間中のメモ:</span></div>
                <div class="report-notes">${notesList || '（この期間のメモはありません）'}</div>
            `;

            const now = new Date();
            const nowStr = `${now.getFullYear()}/${(now.getMonth()+1).toString().padStart(2, '0')}/${now.getDate().toString().padStart(2, '0')} ${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;
            localStorage.setItem('last_summary_ts_final', now.getTime());
            localStorage.setItem('last_summary_str_final', nowStr);
            document.getElementById('summary-ts').innerText = `前回まとめ作成：${nowStr}`;
        }

        // 3段階評価の判定テキストを返す関数
        function getEvaluationLabel(val) {
            if (val >= 7.5) return '良好';
            if (val >= 4.5) return '普通';
            return '低下気味';
        }

        window.onload = () => {
            const logs = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
            const logList = document.getElementById('log-list');
            
            // 前回まとめ作成日時の復元表示
            const savedStr = localStorage.getItem('last_summary_str_final');
            if (savedStr) document.getElementById('summary-ts').innerText = `前回まとめ作成：${savedStr}`;

            // 履歴リストの描画（新しいもの順に並び替え）
            logs.slice().reverse().forEach(l => {
                const div = document.createElement('div');
                div.className = 'log-item';
                // 各アイテムに固有のIDを設定（タイムスタンプベース）
                const itemTs = l.ts || new Date(l.date).getTime();
                div.id = `log-${itemTs}`;
                div.innerHTML = `<span class="log-date">${l.date}</span>気分: ${l.mood} | 体調: ${l.cond}<br>${l.note || ''}`;
                logList.appendChild(div);
            });

            // グラフ描画
            const last10 = logs.slice(-10);
            const ctx = document.getElementById('myChart').getContext('2d');
            
            const myChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: last10.map(l => l.date),
                    datasets: [
                        { 
                            label: '気分', data: last10.map(l => l.mood), 
                            borderColor: '#3b82f6', backgroundColor: '#3b82f6',
                            borderWidth: 2, tension: 0.3, pointRadius: 4, pointBackgroundColor: '#3b82f6',
                            pointHitRadius: 25
                        },
                        { 
                            label: '体調', data: last10.map(l => l.cond), 
                            borderColor: '#f59e0b', backgroundColor: '#f59e0b',
                            borderWidth: 2, tension: 0.3, pointRadius: 4, pointBackgroundColor: '#f59e0b',
                            pointHitRadius: 25
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    layout: { padding: { left: 10, right: 20, bottom: 20 } },
                    interaction: { mode: 'index', intersect: false },
                    onClick: (evt, elements, chart) => {
                        const activePoints = chart.getElementsAtEventForMode(evt, 'index', { intersect: false }, true);
                        if (activePoints.length > 0) {
                            const index = activePoints[0].index;
                            const logData = last10[index];
                            const targetTimestamp = logData.ts || new Date(logData.date).getTime();
                            scrollToLog(targetTimestamp);
                        }
                    },
                    scales: {
                        x: { 
                            ticks: { 
                                maxRotation: 45, 
                                minRotation: 45, 
                                font: { size: 9 },
                                autoSkip: true,
                                maxTicksLimit: 7
                            },
                            grid: { display: false }
                        },
                        y: { min: 1, max: 10, ticks: { stepSize: 1, font: { size: 10 } }, grid: { color: '#f3f4f6' } }
                    },
                    plugins: { legend: { position: 'top' } }
                }
            });

            // グラフクリック時にログ一覧の該当項目にジャンプする関数
            function scrollToLog(timestamp) {
                const logItems = document.querySelectorAll('.log-item');
                const targetElement = document.getElementById(`log-${timestamp}`);
                
                if (highlightTimeout) clearTimeout(highlightTimeout);
                
                logItems.forEach(item => {
                    item.style.transition = 'none';
                    item.classList.remove('highlight');
                    item.offsetHeight; // リフロー
                    item.style.transition = '';
                });

                if (targetElement) {
                    targetElement.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    
                    setTimeout(() => {
                        targetElement.classList.add('highlight');
                    }, 10);

                    highlightTimeout = setTimeout(() => {
                        targetElement.classList.remove('highlight');
                    }, 3000);
                }
            }
        };
    </script>
</body>
</html>
