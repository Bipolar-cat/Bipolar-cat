<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InnerNote</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<div class="container">

    <h1>InnerNote</h1>
    <p class="subtitle">**気分と調子の変化を記録**</p>

    <button onclick="toggleSettings()" class="settings-btn">
    ⚙ 設定
</button>

<h2>⚙ 設定</h2>

<hr>

<!-- 診断名 -->

<h3>■ 診断名</h3>

<select id="diagnosis-select">
    <option value="">診断名を選択</option>
    <option>未診断（健常者）</option>
    <option>うつ病</option>
    <option>双極症</option>
    <option>統合失調症</option>
    <option>不安障害</option>
    <option>適応障害</option>
    <option>発達障害</option>
    <option>その他</option>
</select>

<input
    type="text"
    id="diagnosis-other"
    placeholder="診断名を入力"
    style="display:none;"
>

<hr>

<!-- 記録方式 -->

<h3>■ 記録方式</h3>

<label>
    <input type="radio" name="recordMode" value="3">
    3段階（簡単）
</label>

<br>

<label>
    <input type="radio" name="recordMode" value="10" checked>
    10段階（詳細）
</label>

<hr>

<!-- 年代 -->

<h3>■ 年代</h3>

<select id="age-select">

    <option value="">年代を選択</option>

    <option>10代</option>
    <option>20代</option>
    <option>30代</option>
    <option>40代</option>
    <option>50代</option>
    <option>60代以上</option>

</select>

<hr>

<!-- 属性・環境 -->

<h3>■ 属性・環境（複数選択）</h3>

<label><input type="checkbox" value="学生"> 学生</label><br>
<label><input type="checkbox" value="就労中"> 就労中</label><br>
<label><input type="checkbox" value="休職中"> 休職中</label><br>
<label><input type="checkbox" value="求職中"> 求職中</label><br>
<label><input type="checkbox" value="主婦・主夫"> 主婦・主夫</label><br>
<label><input type="checkbox" value="無職"> 無職</label><br>

<br>

<label><input type="checkbox" value="一人暮らし"> 一人暮らし</label><br>
<label><input type="checkbox" value="家族と同居"> 家族と同居</label><br>
<label><input type="checkbox" value="配偶者あり"> 配偶者あり</label><br>
<label><input type="checkbox" value="子どもあり"> 子どもあり</label><br>

<br>

<label><input type="checkbox" value="通院中"> 通院中</label><br>
<label><input type="checkbox" value="障害者手帳あり"> 障害者手帳あり</label><br>
<label><input type="checkbox" value="福祉サービス利用中"> 福祉サービス利用中</label><br>

<br>

<label>
    <input type="checkbox" value="親族に同じ疾患の人がいる">
    親族に同じ疾患の人がいる
</label>

<br><br>

<label>
    <input type="checkbox" id="env-other-check">
    その他
</label>

<input
    type="text"
    id="env-other"
    placeholder="内容を入力"
    style="display:none;"
>

<hr>

<button class="save-btn" onclick="saveSettings()">
    保存
</button>
    
    <!-- 現在の診断名エリア -->
    <div class="diagnosis-area">

        <textarea
            id="note"
            placeholder="今の気持ちをメモ..."></textarea>

        <button
            class="save-btn"
            onclick="saveData()">

            記録する

        </button>

    </div>

    <!-- グラフ -->

    <div class="chart-container">
        <canvas id="myChart"></canvas>
    </div>

    <!-- Summary -->

    <div class="summary-section">

        <button
            class="summary-action-btn"
            onclick="generateSummary()">

            summary (一定期間まとめ)

        </button>

        <div id="summary-ts">
            前回まとめ作成：なし
        </div>

        <div id="summary-card">

            <span class="report-header">
                【一定期間まとめレポート】
            </span>

            <div id="summary-content"></div>

        </div>

    </div>

    <!-- 履歴 -->

    <div class="log-title">
        最近の記録
    </div>

    <div id="log-list" class="log-list"></div>

</div>

    <script>
        function toggleSettings() {
            const modal = document.querySelector('.settings-modal');
            if (modal.style.display === 'block') {
                modal.style.display = 'none';
            } else {
                modal.style.display = 'block';
            }
        }
    </script>

</body>
</html>
