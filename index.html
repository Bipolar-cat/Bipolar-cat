<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InnerNote</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div class="app-container">
    <h1>InnerNote</h1>
    <p class="subtitle">**気分と調子の変化を記録**</p>
    </div>

    <div id="diagnosis-area">
        <select id="diagnosis-select">
            <option value="">主な診断名を選択</option>
            <option value="未診断（健常者）">未診断（健常者）</option>
            <option value="うつ病">うつ病</option>
            <option value="双極症">双極症</option>
            <option value="統合失調症">統合失調症</option>
            <option value="不安障害">不安障害</option>
            <option value="適応障害">適応障害</option>
            <option value="発達障害">発達障害</option>
            <option value="その他">その他</option>
        </select>
    </div>
    </div>

    <div class="mode-select">
        <button onclick="setMode(3)">3段階</button>
        <button onclick="setMode(10)">10段階</button>
    </div>

    <div id="input-fields">
        </div>

    <textarea id="memo" placeholder="一言コメント"></textarea>

    <button id="save-btn" onclick="saveRecord()">記録する</button>

    <div id="result-area" style="display: none;">
        <canvas id="moodChart"></canvas>
        <button onclick="generateSummary()">summary（一定期間まとめ）</button>
        <div id="history-list"></div>
    </div>
</div>
<script src="script.js"></script> 
</body>
</html>
