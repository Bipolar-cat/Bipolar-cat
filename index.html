<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InnerNote</title>
    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
    <script>eruda.init();</script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>InnerNote</h1>
        <p class="subtitle">
            **気分と調子の変化を記録**
        </p>
<button onclick="toggleSettings()">⚙ 設定</button>

<div id="settings-modal" class="settings-modal">
    <h3>診断名</h3>
    <h3>年代</h3>
    <h3>記録方式</h3>
    <h3>属性・環境</h3>
    <button onclick="saveSettings()">保存</button>
</div>

<textarea placeholder="今の気持ちをメモ…"></textarea>
<button class="save-btn">記録する</button>


    <button class="menu-btn">
        最近の記録
    </button>

</div>

<script>
    
    <script src="/Bipolar-cat/storage.js"></script>
    <script src="/Bipolar-cat/settings.js"></script>
    <script src="/Bipolar-cat/logs.js"></script>
    <script src="/Bipolar-cat/chart.js"></script>
    <script src="/Bipolar-cat/summary.js"></script>
    <script src="/Bipolar-cat/script.js"></script>

        

</body>
</html>
