<!DOCTYPE html>
<html lang="ja">

    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
<script>eruda.init();</script>

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>InnerNote</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
<div class="settings">⚙</div>

<style>
.settings{
  position: fixed;
  top: 0;
  right: 0;
  background: red;
  color: white;
  padding: 10px;
}
</style>

<div class="container">

  <h1>InnerNote</h1>

  <p class="subtitle">**気分と調子の変化を記録**</p>

  <label class="label">今の気分は？</label>
  <div id="mood-btns" class="btn-group"></div>

  <label class="label">体の調子は？</label>
  <div id="cond-btns" class="btn-group"></div>

  <textarea placeholder="ひとことメモ"></textarea>

  <canvas id="graph" width="300" height="200"></canvas>

</div>
    
<div id="settings-panel" class="settings-panel">

    <h3>設定</h3>

    <label>記録方式</label>

    <select id="record-mode">
        <option value="3">3段階</option>
        <option value="10">10段階</option>
    </select>

    <br><br>

    <label>診断名</label>

    <select id="diagnosis">
        <option value="">未診断</option>
        <option value="うつ病">うつ病</option>
        <option value="双極症">双極症</option>
        <option value="統合失調症">統合失調症</option>
        <option value="不安障害">不安障害</option>
        <option value="適応障害">適応障害</option>
        <option value="発達障害">発達障害</option>
        <option value="その他">その他</option>
    </select>

    <input
        type="text"
        id="diagnosis-other"
        placeholder="その他を入力">

    <br><br>

    <label>年代</label>

    <select id="age-group">
        <option>10代</option>
        <option>20代</option>
        <option>30代</option>
        <option>40代</option>
        <option>50代</option>
        <option>60代</option>
        <option>70代</option>
        <option>80代以上</option>
    </select>

    <br><br>

    <button
        class="save-settings-btn"
        onclick="saveSettings()">
        保存
    </button>

    <!-- チェック項目 -->
    <h4>チェック項目</h4>

    <label><input type="checkbox" id="job-fulltime"> 正社員</label><br>
    <label><input type="checkbox" id="job-part"> パート・アルバイト</label><br>
    <label><input type="checkbox" id="leave"> 休職中</label><br>
    <label><input type="checkbox" id="unemployed"> 離職中</label><br>
    <label><input type="checkbox" id="student"> 就学中</label><br>
    <label><input type="checkbox" id="leave-school"> 休学中</label><br>
    <label><input type="checkbox" id="no-job"> 無職</label><br>

    <br>

    <label><input type="checkbox" id="housewife"> 主婦・主夫</label><br>
    <label><input type="checkbox" id="married"> 配偶者有</label><br>
    <label><input type="checkbox" id="children"> 子ども有</label><br>
    <label><input type="checkbox" id="alone"> 一人暮らし</label><br>

    <br>

    <label>
        <input type="checkbox" id="family">
        家族と同居
    </label>

    <input
        type="text"
        id="family-detail"
        placeholder="誰と同居">

    <br><br>

    <label>
        <input type="checkbox" id="other-person">
        家族以外と同居
    </label>

    <input
        type="text"
        id="other-person-detail"
        placeholder="誰と同居">

    <br><br>

 <label><input type="checkbox" id="hospital-out"> 通院中</label><br>
 <label><input type="checkbox" id="hospital-visit"> 往診</label><br>


    <label>
        <input type="checkbox"
               id="welfare">
        福祉サービス利用中
    </label><br>

    <label>
        <input type="checkbox"
               id="family-history">
        親族に同じ疾患の人がいる
    </label>

<button
    class="save-settings-btn"
    onclick="saveSettings()">
    保存
</button>
</div>
 
<script src="js/storage.js"></script>
<script src="js/settings.js"></script>
<script src="js/logs.js"></script>
<script src="js/script.js"></script>

</body>
</html>
