<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InnerNote</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
      <div class="app-container">
    <h1>InnerNote</h1>
    <p>気分と調子の変化を記録</p>
    <section class="section">
        <select id="diagnosis" class="form-control">
            <option value="">-- 診断名を選択 --</option>
            <option value="うつ病">うつ病</option>
            <option value="双極症">双極症</option>
            </select>
    </section>
    <section class="section">
        <div class="button-group">
            <button>3段階</button>
            <button>10段階</button>
        </div>
    </section>

    <section class="section">
        <textarea placeholder="今の気持ちをメモ..." class="memo-area"></textarea>
    </section>

    <section class="section">
        <button class="save-btn">記録する</button>
    </section>
      </div>.js"></script>
</body>
</html>
