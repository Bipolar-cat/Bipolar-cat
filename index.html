<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InnerNote</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
<script>eruda.init();</script>
</head>
<body>

    <div class="container">
        <h1>InnerNote</h1>
        <p>**気分と調子の変化を記録**</p>

<div class="diagnosis-box" id="diagnosis-container" onclick="toggleEdit()">
    <div id="display-area">
        <span id="label-text">主な診断名: <span id="current-diagnosis">未選択</span></span>
    </div>
    
    <div id="edit-area" style="display: none;" onclick="event.stopPropagation()">
        <select id="diagnosis-select" onchange="checkOther(this)">
            <option value="">-- 診断名を選択 --</option>
            <option value="双極症">双極症</option>
            <option value="うつ病">うつ病</option>
            <option value="適応障害">適応障害</option>
            <option value="その他">その他</option>
        </select>
        <input type="text" id="other-diagnosis" placeholder="診断名を入力" style="display:none; margin-top:5px;">
        <button onclick="saveDiagnosis()">保存</button>
    </div>
</div>

        <div class="mode-selector">
            <button onclick="setMode(3)">3段階</button>
            <button onclick="setMode(10)">10段階</button>
        </div>

        <div id="input-area"></div>
        <textarea id="memo" placeholder="今の気持ちをメモ..."></textarea>
        <button id="record-btn" onclick="saveRecord()">記録する</button>
        <canvas id="myChart"></canvas>
        <div id="recent-records"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="script.js"></script>
</body>
</html>
