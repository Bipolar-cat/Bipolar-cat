<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>InnerNote</title>
    <script src="script.js" defer></script>
</head>
<body>
    
<div class="app-container">
    <div class="header-area">
        <h1>InnerNote</h1>
        <p class="subtitle">**気分と調子の変化を記録**</p>
    </div>
    
    <div class="settings-bar">
        <span id="diagnosis-label">診断名: 未設定</span>
        <button onclick="toggleSetting()" class="settings-btn">⚙ 設定</button>
    </div>

    <div id="settings-panel" class="settings-panel" style="display: none;">
        </div>
</div>

 <div id="settings-panel" class="settings-panel" style="display: none;">
        </div>
</div>
    <p style="margin-top:0;">主な診断名を選択</p>
    <select id="diagnosis-select" style="width: 100%; padding: 8px; margin-bottom: 15px;">
        <option value="未診断（健常者）">未診断（健常者）</option>
        <option value="うつ病">うつ病</option>
        <option value="双極症">双極症</option>
        <option value="その他">その他</option>
    </select>

    <p style="margin-top:0;">記録方式を選択</p>
    <label><input type="radio" name="mode" value="3" checked> 3段階</label>
    <label style="margin-left: 15px;"><input type="radio" name="mode" value="10"> 10段階</label>
    
    <button onclick="saveSettings()" style="display: block; margin-top: 15px; width: 100%; padding: 10px; background: #5C6BC0; color: white; border: none; border-radius: 8px;">保存して適用</button>
    </div>

    </div>

    <div id="dynamic-inputs"></div>
</div>

</html>
