<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InnerNote</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<div class="container">

    <h1>InnerNote</h1>
    <p class="subtitle">**気分と調子の変化を記録**</p>

   <button onclick="toggleSettings()" class="settings-btn">
    ⚙ 設定
</button>

https://github.com/Bipolar-cat/Bipolar-cat.github.io/issues
       
    <!-- 現在の診断名エリア -->
    <div class="diagnosis-area">

        <textarea
            id="note"
            placeholder="今の気持ちをメモ..."></textarea>

        <button
            class="save-btn"
            onclick="saveData()">

            記録する

        </button>

    </div>

    <!-- グラフ -->

    <div class="chart-container">
        <canvas id="myChart"></canvas>
    </div>

    <!-- Summary -->

    <div class="summary-section">

        <button
            class="summary-action-btn"
            onclick="generateSummary()">

            summary (一定期間まとめ)

        </button>

        <div id="summary-ts">
            前回まとめ作成：なし
        </div>

        <div id="summary-card">

            <span class="report-header">
                【一定期間まとめレポート】
            </span>

            <div id="summary-content"></div>

        </div>

    </div>

    <!-- 履歴 -->

    <div class="log-title">
        最近の記録
    </div>

    <div id="log-list" class="log-list"></div>

</div>

    <script>
        function toggleSettings() {
            const modal = document.querySelector('.settings-modal');
            if (modal.style.display === 'block') {
                modal.style.display = 'none';
            } else {
                modal.style.display = 'block';
            }
        }
    </script>

</body>
</html>
