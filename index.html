<!doctype html>

<html lang="ja">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>innarva</title>

    <link rel="stylesheet" href="style.css" />

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>

  <body>
    <div class="container">
      <!-- ==========================
         タイトル
    =========================== -->

      <header class="page-header">
        <h1>innarva</h1>

        <button class="settings-btn" onclick="toggleSettings()">⚙</button>
      </header>

      <p class="subtitle">**気分と体調の変化を記録**</p>

      <!-- ==========================
         入力エリア
    =========================== -->

      <section class="input-section">
        <label class="label"> 今の気分は？ </label>

        <div id="mood-btns" class="btn-group"></div>

        <label class="label"> 体の調子は？ </label>

        <div id="cond-btns" class="btn-group"></div>

        <textarea id="note" placeholder="今の気持ちをメモ..."></textarea>

        <button class="save-btn" onclick="saveData()">記録する</button>

        <!-- 保存メッセージ -->

        <div id="status" class="status"></div>
      </section>

      <!-- ==========================
         グラフ
    =========================== -->

      <section class="chart-section">
        <div class="chart-container">
          <canvas id="myChart"></canvas>
        </div>
      </section>
      <!-- ==========================
         Summary
    =========================== -->

      <section class="summary-section">
        <button class="summary-action-btn" onclick="generateSummary()">
          Summary（一定期間まとめ）
        </button>

        <div id="summary-ts" class="summary-ts">前回まとめ作成：なし</div>

        <div id="summary-card" class="summary-card">
          <span class="report-header"> 【一定期間まとめレポート】 </span>

          <div id="summary-content"></div>
        </div>
      </section>

      <!-- ==========================
         最近の記録
    =========================== -->

      <section class="logs-section">
        <h2>最近の記録</h2>

        <div id="log-list" class="log-list"></div>
      </section>
    </div>

    <!-- ==========================
     設定パネル
=========================== -->

    <div id="settings-panel" class="settings-panel">
      <h2>設定</h2>

      <hr />

      <p>入力モード</p>

      <label>
        <input
          type="radio"
          name="mode"
          value="step3"
          onchange="changeMode('step3')"
        />

        Step3（低い・普通・良い）
      </label>

      <br />

      <label>
        <input
          type="radio"
          name="mode"
          value="step10"
          onchange="changeMode('step10')"
        />

        Step10（1〜10）
      </label>

      <hr />

      <button class="close-btn" onclick="toggleSettings()">閉じる</button>
    </div>

    <!-- ==========================
     JavaScript
=========================== -->
    <script src="js/storage.js"></script>
    <script src="js/logs.js"></script>
    <script src="js/chart.js"></script>
    <script src="js/summary.js"></script>
    <script src="js/settings.js"></script>
    <script src="js/script.js"></script>
  </body>
</html>
