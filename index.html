<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InnerNote</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<div class="container">

    <h1>InnerNote</h1>
    <p class="subtitle">**気分と調子の変化を記録**</p>

    <!-- ⚙ボタン -->
    <button id="settings-btn">
        ⚙ 設定
    </button>

    <!-- 設定モーダル -->
    <div id="settings-modal">

        <h3>⚙ 設定</h3>

        <label>診断名</label>
        <select id="diagnosis">
            <option>双極症</option>
            <option>うつ病</option>
            <option>発達障害</option>
        </select>

        <label>記録方式</label>

        <input type="radio"
               name="mode"
               value="3">
        3段階

        <input type="radio"
               name="mode"
               value="10">
        10段階

        <button onclick="saveSettings()">
            保存
        </button>

    </div>

    <!-- 現在の診断名エリア -->
    <div class="diagnosis-area">

        <textarea
            id="note"
            placeholder="今の気持ちをメモ..."></textarea>

        <button
            class="save-btn"
            onclick="saveData()">

            記録する

        </button>

    </div>

    <!-- グラフ -->

    <div class="chart-container">
        <canvas id="myChart"></canvas>
    </div>

    <!-- Summary -->

    <div class="summary-section">

        <button
            class="summary-action-btn"
            onclick="generateSummary()">

            summary (一定期間まとめ)

        </button>

        <div id="summary-ts">
            前回まとめ作成：なし
        </div>

        <div id="summary-card">

            <span class="report-header">
                【一定期間まとめレポート】
            </span>

            <div id="summary-content"></div>

        </div>

    </div>

    <!-- 履歴 -->

    <div class="log-title">
        最近の記録
    </div>

    <div id="log-list" class="log-list"></div>

</div>

<script src="script.js"></script>

</body>
</html>
