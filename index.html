<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InnerNote</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<div class="container">

    <h1>InnerNote</h1>
    <p class="subtitle">**気分と調子の変化を記録**</p>

    <button onclick="toggleSettings()" class="settings-btn">
    ⚙ 設定
</button>

<div id="settings-modal" class="settings-modal">
    <select id="diagnosis">
        <option value="主な診断名">主な診断名</option>
       <option value="未診断（健常者）">未診断（健常者）</option>
            <option value="うつ病">うつ病</option>
            <option value="双極症">双極症</option>
            <option value="統合失調症">統合失調症</option>
            <option value="不安障害">不安障害</option>
            <option value="適応障害">適応障害</option>
            <option value="発達障害">発達障害</option>
            <option value="その他">その他</option>
    </select>

    <label>記録方式</label>

    <input type="radio" name="mode" value="3"> 3段階
    <input type="radio" name="mode" value="10"> 10段階

    <button onclick="saveSettings()">
        保存
    </button>

</div>
<!-- 年代 -->

<div id="age-select-container">

    <select id="age-select" onchange="lockAge()">

        <option value="">年代を選択</option>

        <option value="10代">10代</option>
        <option value="20代">20代</option>
        <option value="30代">30代</option>
        <option value="40代">40代</option>
        <option value="50代">50代</option>
        <option value="60代以上">60代以上</option>

    </select>

</div>

<div
    id="age-fixed-container"
    style="display:none;">

    <span id="age-text">
        年代：未設定
    </span>

    <button
        type="button"
        class="change-btn"
        onclick="unlockAge()">

        変更

    </button>

</div>
    
    <!-- 現在の診断名エリア -->
    <div class="diagnosis-area">

        <textarea
            id="note"
            placeholder="今の気持ちをメモ..."></textarea>

        <button
            class="save-btn"
            onclick="saveData()">

            記録する

        </button>

    </div>

    <!-- グラフ -->

    <div class="chart-container">
        <canvas id="myChart"></canvas>
    </div>

    <!-- Summary -->

    <div class="summary-section">

        <button
            class="summary-action-btn"
            onclick="generateSummary()">

            summary (一定期間まとめ)

        </button>

        <div id="summary-ts">
            前回まとめ作成：なし
        </div>

        <div id="summary-card">

            <span class="report-header">
                【一定期間まとめレポート】
            </span>

            <div id="summary-content"></div>

        </div>

    </div>

    <!-- 履歴 -->

    <div class="log-title">
        最近の記録
    </div>

    <div id="log-list" class="log-list"></div>

</div>

    <script>
        function toggleSettings() {
            const modal = document.querySelector('.settings-modal');
            if (modal.style.display === 'block') {
                modal.style.display = 'none';
            } else {
                modal.style.display = 'block';
            }
        }
    </script>

</body>
</html>
