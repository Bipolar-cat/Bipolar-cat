<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InnerNote</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<div class="container">
    <h1>InnerNote</h1>
    <p class="subtitle">**気分と調子の変化を記録**</p>

 <button
 <button onclick="toggleSettings()"
        class="settings-btn">
    ⚙ 設定
</button>

<div id="settings-modal"
     class="settings-modal">

    設定内容

</div>

    <h4>診断名</h4>

<select
    id="diagnosis-select"
    onchange="toggleDiagnosisOther()">

    <option value="">主な診断名を選択</option>
            <option value="未診断（健常者）">未診断（健常者）</option>
            <option value="うつ病">うつ病</option>
            <option value="双極症">双極症</option>
            <option value="統合失調症">統合失調症</option>
            <option value="不安障害">不安障害</option>
            <option value="適応障害">適応障害</option>
            <option value="発達障害">発達障害</option>
            <option value="その他">その他</option>
        </select>

<input
    type="text"
    id="diagnosis-other"
    placeholder="診断名を入力"
    style="display:none;">

    <hr>

    <h4>記録方式</h4>

    <label>
        <input type="radio"
               name="recordMode"
               value="3">
        3段階
    </label>

    <label>
        <input type="radio"
               name="recordMode"
               value="10"
               checked>
        10段階
    </label>

    <hr>

    <h4>年代</h4>

    <select id="age-select">
        <option value="">選択してください</option>
        <option value="10代">10代</option>
        <option value="20代">20代</option>
        <option value="30代">30代</option>
        <option value="40代">40代</option>
        <option value="50代">50代</option>
        <option value="60代以上">60代以上</option>
    </select>

    <hr>

  <h4>属性・環境</h4>

<div id="environment-list">

    <label>
        <input type="checkbox" value="学生">
        学生
    </label>

    <label>
        <input type="checkbox" value="就労中">
        就労中
    </label>

    <label>
        <input type="checkbox" value="休職中">
        休職中
    </label>

    <label>
        <input type="checkbox" value="求職中">
        求職中
    </label>

    <label>
        <input type="checkbox" value="主婦・主夫">
        主婦・主夫
    </label>

    <label>
        <input type="checkbox" value="無職">
        無職
    </label>

    <label>
        <input type="checkbox" value="一人暮らし">
        一人暮らし
    </label>

    <label>
        <input type="checkbox" value="同居">
        同居
    </label>

    <label>
    <input
        type="checkbox"
        id="environment-other-check"
        onchange="toggleEnvironmentOther()">

    その他
</label>

<input
    type="text"
    id="environment-other"
    placeholder="内容を入力"
    style="display:none;">

  <div class="input-section">

    <textarea
        id="note"
        placeholder="今の気持ちをメモ...">
    </textarea>

    <button
        class="save-btn"
        onclick="saveData()">

        記録する

    </button>

  </div>

    <!-- グラフ -->

    <div class="chart-container">
        <canvas id="myChart"></canvas>
    </div>

    <!-- Summary -->

    <div class="summary-section">

        <button
            class="summary-action-btn"
            onclick="generateSummary()">

            summary (一定期間まとめ)

        </button>

        <div id="summary-ts">
            前回まとめ作成：なし
        </div>

        <div id="summary-card">

            <span class="report-header">
                【一定期間まとめレポート】
            </span>

            <div id="summary-content"></div>

        </div>

    </div>

    <!-- 履歴 -->

    <div class="log-title">
        最近の記録
    </div>

    <div id="log-list" class="log-list"></div>

</div>

    <script>
        function toggleSettings() {
            const modal = document.querySelector('.settings-modal');
            if (modal.style.display === 'block') {
                modal.style.display = 'none';
            } else {
                modal.style.display = 'block';
            }
        }
    </script>

</body>
</html>
