<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InnerNote</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<div class="container">

    <h1>InnerNote</h1>
    <p class="subtitle">**気分と調子の変化を記録**</p>

  <button onclick="toggleSettings()" class="settings-btn">
    ⚙ 設定
</button>

<div id="settings-modal" class="settings-modal">

    <label>診断名</label>
    <select id="diagnosis-select">
        <option>未診断（健常者）</option>
        <option>うつ病</option>
        <option>双極症</option>
        <option>統合失調症</option>
        <option>不安障害</option>
        <option>適応障害</option>
        <option>発達障害</option>
        <option>その他</option>
    </select>

    <br><br>

    <label>年代</label>
    <select id="age-select">
        <option value="">選択してください</option>
        <option>10代</option>
        <option>20代</option>
        <option>30代</option>
        <option>40代</option>
        <option>50代</option>
        <option>60代以上</option>
    </select>

    <br><br>

    <button onclick="saveSettings()">
        保存
    </button>

</div>

    <!-- グラフ -->

    <div class="chart-container">
        <canvas id="myChart"></canvas>
    </div>

    <!-- Summary -->

    <div class="summary-section">

        <button
            class="summary-action-btn"
            onclick="generateSummary()">

            summary (一定期間まとめ)

        </button>

        <div id="summary-ts">
            前回まとめ作成：なし
        </div>

        <div id="summary-card">

            <span class="report-header">
                【一定期間まとめレポート】
            </span>

            <div id="summary-content"></div>

        </div>

    </div>

    <!-- 履歴 -->

    <div class="log-title">
        最近の記録
    </div>

    <div id="log-list" class="log-list"></div>

</div>

    <script>
        function toggleSettings() {
            const modal = document.querySelector('.settings-modal');
            if (modal.style.display === 'block') {
                modal.style.display = 'none';
            } else {
                modal.style.display = 'block';
            }
        }
    </script>

</body>
</html>
