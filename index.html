<script src="js/storage.js"></script>
<script src="js/logs.js"></script>
<script src="js/chart.js"></script>
<script src="js/summary.js"></script>
<script src="js/settings.js"></script>
<script src="js/script.js"></script>

<body>
<div class="container">

    <!-- ① HEADER -->
    <div class="ui-header">
        <h1>InnerNote</h1>
        <p class="subtitle">気分と体調の変化を記録</p>
    </div>

    <!-- ② INPUT -->
    <div class="ui-input">

        <label>今の気分</label>
        <div id="mood-btns"></div>

        <label>体調</label>
        <div id="cond-btns"></div>

        <textarea id="note" placeholder="今の気持ちをメモ"></textarea>

        <button onclick="saveData()">記録する</button>
    </div>

    <!-- ③ CHART -->
    <div class="ui-chart">
        <canvas id="myChart"></canvas>
    </div>

    <!-- ④ SUMMARY -->
    <div class="ui-summary">

        <button onclick="generateSummary()">
            summary（一定期間まとめ）
        </button>

        <div id="summary-ts"></div>

        <div id="summary-card">
            <div id="summary-content"></div>
        </div>

    </div>

    <!-- ⑤ LOGS -->
    <div class="ui-logs">

        <h2>最近の記録</h2>
        <div id="log-list"></div>

    </div>

</div>
</body>
